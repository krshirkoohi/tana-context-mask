[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tana-context-mask"
version = "1.0.0"
description = "An embedding-backed, graph-aware semantic context acquisition engine for Tana Outliner and ChatGPT"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kavia", email = "krshirkoohi@aol.co.uk" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "lancedb>=0.6.0",
    "fastembed>=0.2.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
tana-context-mask = "tana_context_mask.cli.main:cli_entrypoint"

[tool.setuptools.packages.find]
include = ["tana_context_mask*"]

